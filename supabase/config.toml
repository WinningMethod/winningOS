project_id = "winningos-core"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://winning-os.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:3000",
  "https://winning-os.vercel.app",
  "https://winning-os-git-feat-auth-prof-ab1cc8-carter-turnbull-s-projects.vercel.app",
  "https://*-carter-turnbull-s-projects.vercel.app",
]
jwt_expiry = 3600
enable_signup = true
# Email + password is the primary auth method (issue #39); passwords keep email
# out of the sign-in hot path. Email remains for invites, confirmation, recovery.
minimum_password_length = 8

[auth.email]
sender_name = "WinningOS Core"

[auth.email.template.magic_link]
subject = "Sign in to WinningOS Core"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to WinningOS Core"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirm your WinningOS Core email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your WinningOS Core password"
content_path = "./supabase/templates/recovery.html"
