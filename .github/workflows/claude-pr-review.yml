name: Claude PR Review

# Automatically review every pull request with Claude Code.
# Runs when a PR is opened and on each new push to the PR branch.
on:
  pull_request:
    types: [opened, synchronize]

# Avoid stacking reviews when commits land in quick succession:
# a new push cancels the in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token from a Claude subscription (run `claude setup-token`),
          # stored as a repo secret. No Anthropic API key / per-use billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's built-in token for GitHub API calls (posting the
          # review comment). This avoids requiring the Claude GitHub App to be
          # installed on the repo; the `permissions:` block below scopes it.
          # Comments will appear from github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # TEMP: surface the full Claude error in logs while debugging auth.
          show_full_output: true
          prompt: |
            Review the pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            This is "WinningOS Core" — a static Next.js (App Router) wireframe with
            no backend, auth, or network calls (mock data only). Keep the canonical
            vocabulary in mind: workspace / profile / member / role / permission / plugin.

            Focus your review on:
            - Correctness bugs and broken behavior
            - Accessibility (semantic HTML, ARIA, keyboard nav)
            - Security hardening regressions (response headers, no leaked secrets)
            - React / Next.js App Router best practices
            - Dead code and needless complexity

            Be concise and specific. Use `gh pr diff` to read the change and leave your
            review with `gh pr comment`. Prefix the comment with a short verdict
            (e.g. "✅ Looks good" or "⚠️ Changes suggested"). If the diff is trivial,
            say so briefly rather than inventing nits.
          claude_args: |
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Read,Grep,Glob"
